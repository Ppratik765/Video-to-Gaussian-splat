name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y ffmpeg

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with Ruff
      run: ruff check .

    - name: Type check with mypy
      run: mypy src

    - name: Run unit tests
      run: pytest tests/unit -v --tb=short

    - name: Run integration tests (requires ffmpeg)
      run: pytest tests/unit/integration -v --tb=short