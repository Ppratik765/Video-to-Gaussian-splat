[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "splat360"
version = "0.1.0"
description = "360 Video to Gaussian Splat Pipeline"
dependencies = [
    "pydantic",
    "numpy",
    "typer",
    "rich"
]

[project.scripts]
splat360 = "splat360.cli:app"
